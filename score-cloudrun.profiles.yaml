- id: community-default-terraform
  name: default
  format: terraform
  description: Self-contained Cloud Run Terraform configuration with project foundation, VPC, Secret Manager refs, domain routing, Cloud Scheduler, and bootstrap Job.
  manifests: |
    {{- $workloadName := .WorkloadName }}
    {{- $hasRedis := false }}
    {{- range $resName, $res := .Spec.Resources }}
    {{- if eq $res.Type "redis" }}{{- $hasRedis = true }}{{- end }}
    {{- end }}
    {{- $appImage := "" }}
    {{- $hasDatabaseUrl := false }}
    {{- $hasCronSecret := false }}
    {{- range $containerName, $container := .Spec.Containers }}
    {{- if eq $appImage "" }}{{- $appImage = $container.Image }}{{- end }}
    {{- range $variableName, $variableValue := $container.Variables }}
    {{- if and (eq $variableName "DATABASE_URL") (or (lt (len $variableValue) 6) (ne (slice $variableValue 0 6) "gcpsm:")) }}
    {{- $hasDatabaseUrl = true }}
    {{- end }}
    {{- if eq $variableName "CRON_SECRET" }}
    {{- $hasCronSecret = true }}
    {{- end }}
    {{- end }}
    {{- end }}
    terraform {
      required_version = ">= 1.6.0"

      required_providers {
        google = {
          source  = "hashicorp/google"
          version = "~> 6.0"
        }
        random = {
          source  = "hashicorp/random"
          version = "~> 3.6"
        }
      }
    }

    provider "google" {
      project               = var.project_id
      region                = var.region
      user_project_override = true
      billing_project       = var.project_id
    }

    data "google_project" "current" {
      project_id = var.project_id
    }

    variable "project_id" {
      type        = string
      description = "Google Cloud Project ID"
      default     = "{{ hclescape .ProjectId }}"
    }

    variable "region" {
      type        = string
      description = "Primary GCP region (us-east4 for Tier 1 Cloud Run pricing and native domain mappings)"
      default     = "{{ hclescape .Location }}"
    }

    variable "org_domain" {
      type        = string
      description = "Organization root domain served by Cloud Run"
      default     = "community.kcdmontreal.org"
    }

    variable "launch_cities" {
      type        = list(string)
      description = "Launch City subdomains under org_domain"
      default     = ["montreal"]
    }

    variable "app_image" {
      type        = string
      description = "Optional container image URI override for bootstrap jobs"
      default     = ""
    }

    variable "smtp_password" {
      type        = string
      description = "Resend SMTP API key stored in Secret Manager"
      sensitive   = true
      default     = ""
    }

    variable "better_auth_secret" {
      type        = string
      description = "Optional session signing secret override (auto-generated when empty)"
      sensitive   = true
      default     = ""
    }

    variable "cron_secret" {
      type        = string
      description = "Optional cron bearer secret override (auto-generated when empty)"
      sensitive   = true
      default     = ""
    }

    variable "bootstrap_hq_admin_email" {
      type        = string
      description = "Optional initial HQ Admin email for server/bootstrap.js"
      sensitive   = true
      default     = ""
    }

    variable "enable_domain_mapping" {
      type        = bool
      description = "Enable $0 native Cloud Run domain mappings"
      default     = true
    }

    variable "enable_wildcard_lb" {
      type        = bool
      description = "Enable Global External HTTPS Load Balancer and Wildcard Certificate Manager"
      default     = false
    }

    variable "enable_cdn" {
      type        = bool
      description = "Enable Cloud CDN when enable_wildcard_lb is true"
      default     = false
    }

    variable "github_repository" {
      type        = string
      description = "Optional GitHub owner/repo allowed to deploy via Workload Identity Federation"
      default     = ""
    }

    variable "billing_account_id" {
      type        = string
      description = "Optional GCP Billing Account ID for sandbox budget alerts"
      default     = ""
    }

    variable "monthly_budget_usd" {
      type        = number
      description = "Monthly sandbox billing alert threshold in the billing account currency"
      default     = 25
    }

    variable "budget_currency" {
      type        = string
      description = "3-letter currency code matching the GCP billing account (e.g. USD, CAD)"
      default     = "USD"
    }

    variable "cloudsql_instance_name" {
      type        = string
      description = "Existing Cloud SQL instance name when using split-state lookup provisioners"
      default     = "community-pg"
    }

    variable "s3_public_base_url" {
      type        = string
      description = "Optional public base URL override for S3/GCS assets in lookup mode"
      default     = ""
    }

    locals {
      base_apis = [
        "run.googleapis.com",
        "sqladmin.googleapis.com",
        "servicenetworking.googleapis.com",
        "secretmanager.googleapis.com",
        "cloudscheduler.googleapis.com",
        "artifactregistry.googleapis.com",
        "compute.googleapis.com",
        "cloudresourcemanager.googleapis.com",
        "iam.googleapis.com",
        "iamcredentials.googleapis.com",
        {{- if $hasRedis }}
        "redis.googleapis.com",
        {{- end }}
      ]
      extra_apis = concat(
        var.enable_wildcard_lb ? ["certificatemanager.googleapis.com"] : [],
        var.billing_account_id != "" ? ["billingbudgets.googleapis.com"] : []
      )
    }

    resource "google_project_service" "apis" {
      for_each           = toset(concat(local.base_apis, local.extra_apis))
      project            = var.project_id
      service            = each.key
      disable_on_destroy = false
    }

    resource "google_artifact_registry_repository" "app" {
      project       = var.project_id
      location      = var.region
      repository_id = "community"
      format        = "DOCKER"
      depends_on    = [google_project_service.apis]
    }

    resource "google_compute_network" "vpc" {
      project                 = var.project_id
      name                    = "community-vpc"
      auto_create_subnetworks = false
      depends_on              = [google_project_service.apis]
    }

    resource "google_compute_subnetwork" "subnet" {
      project                  = var.project_id
      name                     = "community-subnet"
      ip_cidr_range            = "10.8.0.0/24"
      region                   = var.region
      network                  = google_compute_network.vpc.id
      private_ip_google_access = true
    }

    resource "google_compute_global_address" "psa_range" {
      project       = var.project_id
      name          = "community-sql-psa-range"
      purpose       = "VPC_PEERING"
      address_type  = "INTERNAL"
      prefix_length = 16
      network       = google_compute_network.vpc.id
    }

    resource "google_service_networking_connection" "private_vpc_connection" {
      network                 = google_compute_network.vpc.id
      service                 = "servicenetworking.googleapis.com"
      reserved_peering_ranges = [google_compute_global_address.psa_range.name]
      depends_on              = [google_project_service.apis]
    }

    resource "google_iam_workload_identity_pool" "github" {
      count                     = var.github_repository != "" ? 1 : 0
      project                   = var.project_id
      workload_identity_pool_id = "github-actions"
      display_name              = "GitHub Actions Pool"
      depends_on                = [google_project_service.apis]
    }

    resource "google_iam_workload_identity_pool_provider" "github" {
      count                              = var.github_repository != "" ? 1 : 0
      project                            = var.project_id
      workload_identity_pool_id          = google_iam_workload_identity_pool.github[0].workload_identity_pool_id
      workload_identity_pool_provider_id = "github-oidc"
      display_name                       = "GitHub OIDC"
      attribute_condition                = "assertion.repository == \"${var.github_repository}\""

      attribute_mapping = {
        "google.subject"       = "assertion.sub"
        "attribute.repository" = "assertion.repository"
      }

      oidc {
        issuer_uri = "https://token.actions.githubusercontent.com"
      }
    }

    resource "google_service_account" "github_deploy" {
      count      = var.github_repository != "" ? 1 : 0
      project    = var.project_id
      account_id = "community-gh-deploy"
    }

    resource "google_project_iam_member" "github_deploy_roles" {
      for_each = var.github_repository != "" ? toset(["roles/run.admin", "roles/artifactregistry.writer", "roles/iam.serviceAccountUser"]) : toset([])
      project  = var.project_id
      role     = each.key
      member   = "serviceAccount:${google_service_account.github_deploy[0].email}"
    }

    resource "google_service_account_iam_member" "github_wif_binding" {
      count              = var.github_repository != "" ? 1 : 0
      service_account_id = google_service_account.github_deploy[0].name
      role               = "roles/iam.workloadIdentityUser"
      member             = "principalSet://iam.googleapis.com/${google_iam_workload_identity_pool.github[0].name}/attribute.repository/${var.github_repository}"
    }

    resource "google_billing_budget" "sandbox" {
      count           = var.billing_account_id != "" ? 1 : 0
      billing_account = var.billing_account_id
      display_name    = "community-sandbox-budget"

      budget_filter {
        projects = ["projects/${data.google_project.current.number}"]
      }

      amount {
        specified_amount {
          currency_code = var.budget_currency
          units         = tostring(var.monthly_budget_usd)
        }
      }

      threshold_rules { threshold_percent = 0.5 }
      threshold_rules { threshold_percent = 0.9 }
      threshold_rules { threshold_percent = 1.0 }

      depends_on = [google_project_service.apis]
    }

    resource "google_service_account" "{{ $workloadName }}" {
      project    = "{{ .ProjectId }}"
      account_id = "community-{{ $workloadName }}"
    }

    resource "google_cloud_run_v2_service" "{{ $workloadName }}" {
      project             = "{{ .ProjectId }}"
      location            = "{{ .Location }}"
      name                = "{{ $workloadName }}"
      deletion_protection = false
      ingress             = "INGRESS_TRAFFIC_ALL"

      template {
        service_account = google_service_account.{{ $workloadName }}.email

        scaling {
          min_instance_count = 0
          max_instance_count = 10
        }

        vpc_access {
          network_interfaces {
            network    = google_compute_network.vpc.name
            subnetwork = google_compute_subnetwork.subnet.name
          }
          egress = "PRIVATE_RANGES_ONLY"
        }

        {{- range $containerName, $container := .Spec.Containers }}
        containers {
          name  = "{{ hclescape $containerName }}"
          image = "{{ hclescape $container.Image }}"

          {{- $hasPort := false }}
          {{- if $.Spec.Service }}
          {{- range $portName, $port := $.Spec.Service.Ports }}
          {{- if not $hasPort }}
          ports {
            container_port = {{ if $port.TargetPort }}{{ $port.TargetPort }}{{ else }}{{ $port.Port }}{{ end }}
          }
          {{- $hasPort = true }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if not $hasPort }}
          ports {
            container_port = 3000
          }
          {{- end }}

          resources {
            cpu_idle = true
            limits = {
              cpu    = "1"
              memory = "512Mi"
            }
          }

          {{- range $variableName, $variableValue := $container.Variables }}
          {{- if ne $variableName "PORT" }}
          {{- if and (ge (len $variableValue) 6) (eq (slice $variableValue 0 6) "gcpsm:") }}
          env {
            name = "{{ hclescape $variableName }}"
            value_source {
              secret_key_ref {
                secret  = basename(split("@", "{{ hclescape (slice $variableValue 6) }}")[0])
                version = length(split("@", "{{ hclescape (slice $variableValue 6) }}")) > 1 ? split("@", "{{ hclescape (slice $variableValue 6) }}")[1] : "latest"
              }
            }
          }
          {{- else if eq $variableName "DATABASE_URL" }}
          env {
            name = "{{ hclescape $variableName }}"
            value_source {
              secret_key_ref {
                secret  = basename(google_secret_manager_secret_iam_member.{{ $workloadName }}_database_url.secret_id)
                version = google_secret_manager_secret_version.{{ $workloadName }}_database_url.version
              }
            }
          }
          {{- else }}
          env {
            name  = "{{ hclescape $variableName }}"
            value = "{{ hclescape $variableValue }}"
          }
          {{- end }}
          {{- end }}
          {{- end }}
        }
        {{- end }}
      }

      depends_on = [google_project_service.apis]
    }

    resource "google_cloud_run_v2_service_iam_member" "{{ $workloadName }}_public_invoker" {
      project  = "{{ .ProjectId }}"
      location = "{{ .Location }}"
      name     = google_cloud_run_v2_service.{{ $workloadName }}.name
      role     = "roles/run.invoker"
      member   = "allUsers"
    }

    {{- range $containerName, $container := .Spec.Containers }}
    {{- range $variableName, $variableValue := $container.Variables }}
    {{- if and (eq $variableName "DATABASE_URL") (or (lt (len $variableValue) 6) (ne (slice $variableValue 0 6) "gcpsm:")) }}
    resource "google_secret_manager_secret" "{{ $workloadName }}_database_url" {
      project   = "{{ $.ProjectId }}"
      secret_id = "community-{{ $workloadName }}-database-url"
      replication {
        auto {}
      }
      depends_on = [google_project_service.apis]
    }

    resource "google_secret_manager_secret_version" "{{ $workloadName }}_database_url" {
      secret      = google_secret_manager_secret.{{ $workloadName }}_database_url.id
      secret_data = "{{ hclescape $variableValue }}"
    }

    resource "google_secret_manager_secret_iam_member" "{{ $workloadName }}_database_url" {
      project    = "{{ $.ProjectId }}"
      secret_id  = google_secret_manager_secret.{{ $workloadName }}_database_url.secret_id
      role       = "roles/secretmanager.secretAccessor"
      member     = "serviceAccount:${google_service_account.{{ $workloadName }}.email}"
      depends_on = [google_secret_manager_secret_version.{{ $workloadName }}_database_url]
    }
    {{- end }}
    {{- end }}
    {{- end }}

    {{- if $hasDatabaseUrl }}
    resource "google_secret_manager_secret" "bootstrap_hq_admin_email" {
      count     = var.bootstrap_hq_admin_email != "" ? 1 : 0
      project   = var.project_id
      secret_id = "community-bootstrap-hq-admin-email"
      replication {
        auto {}
      }
      depends_on = [google_project_service.apis]
    }

    resource "google_secret_manager_secret_version" "bootstrap_hq_admin_email" {
      count       = var.bootstrap_hq_admin_email != "" ? 1 : 0
      secret      = google_secret_manager_secret.bootstrap_hq_admin_email[0].id
      secret_data = var.bootstrap_hq_admin_email
    }

    resource "google_secret_manager_secret_iam_member" "bootstrap_hq_admin_email" {
      count      = var.bootstrap_hq_admin_email != "" ? 1 : 0
      project    = var.project_id
      secret_id  = google_secret_manager_secret.bootstrap_hq_admin_email[0].secret_id
      role       = "roles/secretmanager.secretAccessor"
      member     = "serviceAccount:${google_service_account.{{ $workloadName }}.email}"
      depends_on = [google_secret_manager_secret_version.bootstrap_hq_admin_email]
    }

    resource "google_cloud_run_v2_job" "db_bootstrap" {
      project             = var.project_id
      location            = var.region
      name                = "community-db-bootstrap"
      deletion_protection = false

      template {
        template {
          service_account = google_service_account.{{ $workloadName }}.email
          timeout         = "300s"

          vpc_access {
            network_interfaces {
              network    = google_compute_network.vpc.name
              subnetwork = google_compute_subnetwork.subnet.name
            }
            egress = "PRIVATE_RANGES_ONLY"
          }

          containers {
            image   = var.app_image != "" ? var.app_image : "{{ hclescape $appImage }}"
            command = ["node", "server/bootstrap.js"]

            env {
              name = "DATABASE_URL"
              value_source {
                secret_key_ref {
                  secret  = basename(google_secret_manager_secret_iam_member.{{ $workloadName }}_database_url.secret_id)
                  version = google_secret_manager_secret_version.{{ $workloadName }}_database_url.version
                }
              }
            }

            env {
              name  = "ORG_DOMAIN"
              value = var.org_domain
            }

            dynamic "env" {
              for_each = var.bootstrap_hq_admin_email != "" ? [1] : []
              content {
                name = "BOOTSTRAP_HQ_ADMIN_EMAIL"
                value_source {
                  secret_key_ref {
                    secret  = basename(google_secret_manager_secret_iam_member.bootstrap_hq_admin_email[0].secret_id)
                    version = google_secret_manager_secret_version.bootstrap_hq_admin_email[0].version
                  }
                }
              }
            }
          }
        }
      }

      depends_on = [google_project_service.apis]
    }
    {{- end }}

    resource "google_cloud_run_domain_mapping" "org" {
      count    = var.enable_domain_mapping ? 1 : 0
      project  = var.project_id
      location = var.region
      name     = var.org_domain

      metadata {
        namespace = var.project_id
      }

      spec {
        route_name = google_cloud_run_v2_service.{{ $workloadName }}.name
      }
    }

    resource "google_cloud_run_domain_mapping" "cities" {
      for_each = var.enable_domain_mapping ? toset(var.launch_cities) : toset([])
      project  = var.project_id
      location = var.region
      name     = "${each.key}.${var.org_domain}"

      metadata {
        namespace = var.project_id
      }

      spec {
        route_name = google_cloud_run_v2_service.{{ $workloadName }}.name
      }
    }

    resource "google_compute_global_address" "lb" {
      count      = var.enable_wildcard_lb ? 1 : 0
      project    = var.project_id
      name       = "community-lb-ip"
      depends_on = [google_project_service.apis]
    }

    resource "google_certificate_manager_dns_authorization" "wildcard" {
      count      = var.enable_wildcard_lb ? 1 : 0
      project    = var.project_id
      name       = "community-wildcard-dns-auth"
      domain     = var.org_domain
      depends_on = [google_project_service.apis]
    }

    resource "google_certificate_manager_certificate" "wildcard" {
      count   = var.enable_wildcard_lb ? 1 : 0
      project = var.project_id
      name    = "community-wildcard-cert"

      managed {
        domains            = [var.org_domain, "*.${var.org_domain}"]
        dns_authorizations = [google_certificate_manager_dns_authorization.wildcard[0].id]
      }
    }

    resource "google_certificate_manager_certificate_map" "wildcard" {
      count   = var.enable_wildcard_lb ? 1 : 0
      project = var.project_id
      name    = "community-wildcard-map"
    }

    resource "google_certificate_manager_certificate_map_entry" "root" {
      count        = var.enable_wildcard_lb ? 1 : 0
      project      = var.project_id
      name         = "root-domain"
      map          = google_certificate_manager_certificate_map.wildcard[0].name
      certificates = [google_certificate_manager_certificate.wildcard[0].id]
      hostname     = var.org_domain
    }

    resource "google_certificate_manager_certificate_map_entry" "wildcard" {
      count        = var.enable_wildcard_lb ? 1 : 0
      project      = var.project_id
      name         = "wildcard-domain"
      map          = google_certificate_manager_certificate_map.wildcard[0].name
      certificates = [google_certificate_manager_certificate.wildcard[0].id]
      hostname     = "*.${var.org_domain}"
    }

    resource "google_compute_region_network_endpoint_group" "web_neg" {
      count                 = var.enable_wildcard_lb ? 1 : 0
      project               = var.project_id
      name                  = "community-web-neg"
      network_endpoint_type = "SERVERLESS"
      region                = var.region

      cloud_run {
        service = google_cloud_run_v2_service.{{ $workloadName }}.name
      }
    }

    resource "google_compute_backend_service" "web" {
      count                 = var.enable_wildcard_lb ? 1 : 0
      project               = var.project_id
      name                  = "community-web-backend"
      load_balancing_scheme = "EXTERNAL_MANAGED"
      enable_cdn            = var.enable_cdn

      backend {
        group = google_compute_region_network_endpoint_group.web_neg[0].id
      }
    }

    resource "google_compute_url_map" "web" {
      count           = var.enable_wildcard_lb ? 1 : 0
      project         = var.project_id
      name            = "community-web-urlmap"
      default_service = google_compute_backend_service.web[0].id
    }

    resource "google_compute_target_https_proxy" "web" {
      count           = var.enable_wildcard_lb ? 1 : 0
      project         = var.project_id
      name            = "community-web-https-proxy"
      url_map         = google_compute_url_map.web[0].id
      certificate_map = "//certificatemanager.googleapis.com/${google_certificate_manager_certificate_map.wildcard[0].id}"
    }

    resource "google_compute_global_forwarding_rule" "web_https" {
      count                 = var.enable_wildcard_lb ? 1 : 0
      project               = var.project_id
      name                  = "community-web-https"
      target                = google_compute_target_https_proxy.web[0].id
      ip_address            = google_compute_global_address.lb[0].address
      load_balancing_scheme = "EXTERNAL_MANAGED"
      port_range            = "443"
    }

    {{- if $hasCronSecret }}
    locals {
      cron_base_url = (var.enable_domain_mapping || var.enable_wildcard_lb) ? "https://${var.org_domain}" : google_cloud_run_v2_service.{{ $workloadName }}.uri
    }

    resource "google_cloud_scheduler_job" "run_due_jobs" {
      project     = var.project_id
      region      = var.region
      name        = "community-run-due-jobs"
      description = "Triggers webhook-mode pg-boss email retries and due jobs every minute"
      schedule    = "* * * * *"
      time_zone   = "UTC"

      http_target {
        uri         = "${local.cron_base_url}/api/cron/run-due-jobs"
        http_method = "POST"
        body        = base64encode("{}")
        headers = {
          "Content-Type"  = "application/json"
          "Authorization" = "Bearer ${local.cron_secret_value}"
        }
      }

      depends_on = [google_project_service.apis, google_cloud_run_v2_service.{{ $workloadName }}]
    }
    {{- end }}

    output "cloud_run_service_url" {
      value = google_cloud_run_v2_service.{{ $workloadName }}.uri
    }

    output "artifact_registry_repository" {
      value = "${var.region}-docker.pkg.dev/${var.project_id}/${google_artifact_registry_repository.app.repository_id}"
    }

    output "lb_ip_address" {
      value = var.enable_wildcard_lb ? google_compute_global_address.lb[0].address : null
    }

    output "wildcard_dns_authorization_record" {
      value = var.enable_wildcard_lb ? google_certificate_manager_dns_authorization.wildcard[0].dns_resource_record : null
    }

    output "github_wif_provider" {
      value = var.github_repository != "" ? google_iam_workload_identity_pool_provider.github[0].name : null
    }

    output "github_deploy_service_account" {
      value = var.github_repository != "" ? google_service_account.github_deploy[0].email : null
    }
