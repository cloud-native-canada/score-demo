name: community
services:
  mailpit:
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    image: axllent/mailpit:v1.27
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      timeout: 2s
      interval: 2s
      retries: 15
    ports:
      - target: 1025
        published: "1025"
      - target: 8025
        published: "8025"
  minio:
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:*,http://127.0.0.1:*,http://*.localhost,http://*.localhost:*,http://*.example,http://*.example:*
      MINIO_ROOT_PASSWORD: community-local
      MINIO_ROOT_USER: community
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    volumes:
      - type: volume
        source: minio-data
        target: /data
    healthcheck:
      test:
        - CMD-SHELL
        - mc alias set local http://localhost:9000 community community-local
      timeout: 2s
      interval: 2s
      retries: 15
    ports:
      - target: 9000
        published: "9000"
      - target: 9001
        published: "9001"
  minio-init:
    command:
      - mc alias set local http://minio:9000 community community-local && mc mb -p local/community && printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::community/public/*"]}]}' > /tmp/public-read.json && mc anonymous set-json /tmp/public-read.json local/community
    entrypoint:
      - /bin/sh
      - -c
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    labels:
      dev.score.compose.labels.is-init-container: "true"
    depends_on:
      minio:
        condition: service_healthy
        restart: true
        required: false
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_DB: community
      POSTGRES_PASSWORD: community
      POSTGRES_USER: community
    image: postgres:17-alpine
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - community
        - -d
        - community
      timeout: 2s
      interval: 2s
      retries: 15
    ports:
      - target: 5432
        published: "5432"
  wait-for-resources:
    command:
      - echo
    image: alpine
    depends_on:
      mailpit:
        condition: service_healthy
        required: true
      minio:
        condition: service_healthy
        required: true
      minio-init:
        condition: service_completed_successfully
        required: true
      postgres:
        condition: service_healthy
        required: true
  web-app:
    annotations:
      compose.score.dev/workload-name: web
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      DATABASE_URL: postgres://community:community@postgres:5432/community
      EMAIL_FROM: Community <no-reply@community.localhost>
      NODE_ENV: production
      PORT: "3000"
      QUEUE_MODE: ${QUEUE_MODE}
      S3_ACCESS_KEY_ID: community
      S3_BUCKET: community
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/community
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: community-local
      SMTP_HOST: mailpit
      SMTP_PASSWORD: community
      SMTP_PORT: "1025"
      SMTP_USER: community
    hostname: web
    build:
      context: .
    depends_on:
      wait-for-resources:
        condition: service_completed_successfully
        required: true
    ports:
      - target: 3000
        published: "3000"
volumes:
  minio-data:
    driver: local
  postgres-data:
    driver: local
